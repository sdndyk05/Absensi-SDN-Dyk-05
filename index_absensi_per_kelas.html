<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi SDN Dayeuhkolot 05</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef6ff;color:#222}
header{background:#1565c0;color:white;text-align:center;padding:22px;border-radius:0 0 22px 22px}
main{max-width:850px;width:94%;margin:18px auto}.card{background:white;padding:18px;margin-bottom:18px;border-radius:16px;box-shadow:0 4px 15px #0001}
h2{font-size:19px;color:#1565c0;text-align:center}label{font-weight:bold;display:block;margin:8px 0 5px}
input,select,button{width:100%;padding:12px;border-radius:9px;border:1px solid #ccc;font-size:15px}
button{border:0;margin-top:8px;font-weight:bold;cursor:pointer}.blue{background:#1565c0;color:white}.green{background:#2e7d32;color:white}.red{background:#c62828;color:white}.gray{background:#eee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{text-align:center;background:#f5f5f5;padding:12px;border-radius:10px}.stat b{display:block;font-size:23px}
#reader{max-width:420px;margin:auto}.msg{padding:10px;margin-top:10px;border-radius:8px;text-align:center;font-weight:bold}.ok{background:#e8f5e9;color:#2e7d32}.bad{background:#ffebee;color:#c62828}
.wrap{overflow:auto}table{width:100%;min-width:650px;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:center;font-size:13px}th{background:#1565c0;color:white}
@media(max-width:600px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><h1>🏫 SDN DAYEUHKOLOT 05</h1><div>ABSENSI SISWA PER KELAS</div></header>
<main>
<div class="card" style="text-align:center"><b id="hari"></b><div id="tanggal"></div><strong style="font-size:28px" id="jam"></strong></div>

<div class="card">
<h2>📝 INPUT ABSENSI</h2>
<div class="grid">
<div><label>Nama Siswa</label><input id="nama" placeholder="Ketik nama siswa"></div>
<div><label>Kelas</label><select id="kelas"><option value="">-- Pilih Kelas --</option><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>4A</option><option>4B</option><option>5A</option><option>5B</option><option>6A</option><option>6B</option></select></div>
</div>
<label>Status</label><select id="status"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Alpa</option></select>
<button class="blue" onclick="scan()">📷 SCAN QR</button><div id="reader"></div>
<button class="green" onclick="save()">✅ SIMPAN ABSENSI</button><button class="gray" onclick="resetForm()">🔄 RESET</button>
<div id="msg"></div>
<p style="font-size:12px;color:#666">QR dapat berisi: <b>Nama Siswa|Kelas</b>, contoh <b>Ahmad|5A</b>.</p>
</div>

<div class="card">
<h2>📊 REKAP PER KELAS</h2>
<div class="grid">
<div><label>Kelas</label><select id="filterKelas" onchange="render()"><option value="SEMUA">Semua Kelas</option><option>1A</option><option>1B</option><option>2A</option><option>2B</option><option>3A</option><option>3B</option><option>4A</option><option>4B</option><option>5A</option><option>5B</option><option>6A</option><option>6B</option></select></div>
<div><label>Tanggal</label><input id="filterTanggal" type="date" onchange="render()"></div>
</div>
<div class="stats" style="margin-top:14px"><div class="stat"><b id="h">0</b>Hadir</div><div class="stat"><b id="i">0</b>Izin</div><div class="stat"><b id="s">0</b>Sakit</div><div class="stat"><b id="a">0</b>Alpa</div></div>
</div>

<div class="card">
<h2>📋 DATA ABSENSI</h2>
<button class="green" onclick="downloadFiltered()">⬇️ DOWNLOAD DATA KELAS</button>
<button class="blue" onclick="downloadAll()">⬇️ DOWNLOAD SEMUA DATA</button>
<button class="gray" onclick="print()">🖨️ CETAK</button>
<div class="wrap"><table><thead><tr><th>No</th><th>Tanggal</th><th>Hari</th><th>Jam</th><th>Nama</th><th>Kelas</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</div>

<div class="card"><h2>🗑️ DATA</h2><button class="red" onclick="deleteFiltered()">HAPUS DATA SESUAI FILTER</button><button class="red" onclick="deleteAll()">HAPUS SEMUA DATA</button></div>
</main>
<footer style="text-align:center;padding:15px;color:#777;font-size:12px">© 2026 SDN Dayeuhkolot 05</footer>

<script>
const days=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
let data=JSON.parse(localStorage.getItem("absensiSDN05")||"[]"),scanner=null;
function iso(d=new Date()){return d.toISOString().slice(0,10)}
function clock(){let d=new Date();hari.textContent=days[d.getDay()];tanggal.textContent=d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});jam.textContent=d.toLocaleTimeString("id-ID")}
setInterval(clock,1000);clock();filterTanggal.value=iso();
function scan(){if(scanner)stopScan();scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:250},code=>{let p=code.split("|");nama.value=(p[0]||"").trim();if(p[1])kelas.value=p[1].trim();message("QR berhasil dibaca.",1);stopScan()},()=>{}).catch(()=>message("Kamera tidak bisa dibuka. Pastikan izin kamera aktif dan website HTTPS.",0))}
function stopScan(){if(scanner){scanner.stop().then(()=>{scanner.clear();scanner=null}).catch(()=>scanner=null)}}
function save(){let n=nama.value.trim(),k=kelas.value,st=status.value,t=iso();if(!n||!k)return message("Nama dan kelas wajib diisi.",0);if(data.some(x=>x.nama.toLowerCase()==n.toLowerCase()&&x.tanggal==t))return message("Siswa ini sudah absen hari ini.",0);let d=new Date();data.push({nama:n,kelas:k,status:st,tanggal:t,hari:days[d.getDay()],jam:d.toLocaleTimeString("id-ID")});localStorage.setItem("absensiSDN05",JSON.stringify(data));resetForm();render();message("Absensi berhasil disimpan.",1)}
function resetForm(){nama.value="";kelas.value="";status.value="Hadir"}
function message(t,ok){msg.textContent=t;msg.className="msg "+(ok?"ok":"bad");setTimeout(()=>msg.className="",4000)}
function filtered(){let k=filterKelas.value,t=filterTanggal.value;return data.filter(x=>(k=="SEMUA"||x.kelas==k)&&(!t||x.tanggal==t))}
function esc(x){let d=document.createElement("div");d.textContent=x;return d.innerHTML}
function render(){let r=filtered();rows.innerHTML=r.length?r.map((x,j)=>`<tr><td>${j+1}</td><td>${x.tanggal}</td><td>${x.hari}</td><td>${x.jam}</td><td>${esc(x.nama)}</td><td>${esc(x.kelas)}</td><td>${x.status}</td></tr>`).join(""):'<tr><td colspan="7">Belum ada data.</td></tr>';h.textContent=r.filter(x=>x.status=="Hadir").length;i.textContent=r.filter(x=>x.status=="Izin").length;s.textContent=r.filter(x=>x.status=="Sakit").length;a.textContent=r.filter(x=>x.status=="Alpa").length}
function makeCSV(r){let q=v=>`"${String(v??"").replaceAll('"','""')}"`;return "﻿"+[["No","Tanggal","Hari","Jam","Nama","Kelas","Status"],...r.map((x,j)=>[j+1,x.tanggal,x.hari,x.jam,x.nama,x.kelas,x.status])].map(x=>x.map(q).join(",")).join("
")}
function download(r,name){if(!r.length)return alert("Tidak ada data untuk didownload.");let b=new Blob([makeCSV(r)],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function downloadFiltered(){download(filtered(),"Absensi_"+filterKelas.value+"_"+filterTanggal.value+".csv")}
function downloadAll(){download(data,"Absensi_SDN_Dayeuhkolot_05_Semua_Data.csv")}
function deleteFiltered(){let r=filtered();if(!r.length)return alert("Tidak ada data sesuai filter.");if(confirm("Hapus data yang tampil?")){let set=new Set(r);data=data.filter(x=>!set.has(x));localStorage.setItem("absensiSDN05",JSON.stringify(data));render()}}
function deleteAll(){if(confirm("Hapus SEMUA data absensi di perangkat ini?")){data=[];localStorage.removeItem("absensiSDN05");render()}}
render();
</script>
</body>
</html>
